<div class="mx-auto mt-12 max-w-sm rounded-lg border border-gray-300 p-6">
  @if (user(); as currentUser) {
    <h2 class="mb-4 text-xl font-semibold">Signed in</h2>

    @if (currentUser.user_metadata.avatar_url; as avatar) {
      <img [src]="avatar" alt="" class="mb-4 size-16 rounded-full" />
    }

    <dl class="mb-5 text-sm">
      <dt class="font-medium">Name</dt>
      <dd class="mb-2 text-gray-600">{{ currentUser.user_metadata.full_name ?? '—' }}</dd>
      <dt class="font-medium">Email</dt>
      <dd class="mb-2 text-gray-600">{{ currentUser.email }}</dd>
      <dt class="font-medium">User ID</dt>
      <dd class="break-all text-gray-600">{{ currentUser.id }}</dd>
    </dl>

    <button
      type="button"
      class="w-full rounded bg-blue-600 px-3 py-2 text-white hover:bg-blue-700"
      (click)="signOut()"
    >
      Sign out
    </button>
  } @else {
    <h2 class="mb-4 text-xl font-semibold">Log in</h2>

    <button
      type="button"
      class="flex w-full items-center justify-center gap-3 rounded border border-gray-300 px-3 py-2 hover:bg-gray-50 disabled:opacity-50"
      [disabled]="loading()"
      (click)="signInWithGoogle()"
    >
      <svg class="size-5" viewBox="0 0 48 48" aria-hidden="true">
        <path
          fill="#4285F4"
          d="M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z"
        />
        <path
          fill="#34A853"
          d="M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z"
        />
        <path
          fill="#FBBC05"
          d="M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z"
        />
        <path
          fill="#EA4335"
          d="M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z"
        />
      </svg>
      @if (loading()) {
        Redirecting…
      } @else {
        Continue with Google
      }
    </button>

    @if (error()) {
      <p class="mt-3 text-sm text-red-600">{{ error() }}</p>
    }
  }
</div>
