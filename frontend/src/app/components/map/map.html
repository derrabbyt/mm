<button (click)="start()">Display random Points</button>

<h3>Members</h3>

<button (click)="refresh()">Refresh from backend</button>

<form (ngSubmit)="addMember()">
  <input name="newName" [(ngModel)]="newName" placeholder="Name" />
  <button type="submit">Add member</button>
</form>

<ul>
  @for (member of members(); track member.id) {
    <li>
      <label>
        <input
          type="radio"
          name="selectedMember"
          [value]="member.id"
          [checked]="member.id === selectedId()"
          (change)="selectMember(member.id)"
        />
        {{ member.name }}
        @if (member.position) {
          ({{ member.position.latitude | number: '1.5-5' }},
          {{ member.position.longitude | number: '1.5-5' }})
        } @else {
          (not placed)
        }
      </label>
    </li>
  } @empty {
    <li>No members yet.</li>
  }
</ul>

@if (selected(); as member) {
  <p>Selected: {{ member.name }} — click the map to place them.</p>
} @else {
  <p>Select a member to place them on the map.</p>
}

<mgl-map
  [mapStyle]="mapStyle"
  [center]="center"
  [zoom]="zoom"
  cursorStyle="crosshair"
  (mapClick)="onMapClick($event)"
>
  <mgl-geojson-source id="random-points" [data]="points()" />

  <mgl-layer
    id="random-points-layer"
    type="circle"
    source="random-points"
    [paint]="{
      'circle-radius': 6,
      'circle-color': '#e5484d',
      'circle-stroke-width': 1.5,
      'circle-stroke-color': '#ffffff'
    }"
  />

  @for (member of placed(); track member.id) {
    <mgl-marker
      [lngLat]="[member.position!.longitude, member.position!.latitude]"
      [color]="member.id === selectedId() ? '#0090ff' : '#30a46c'"
    />
  }
</mgl-map>
