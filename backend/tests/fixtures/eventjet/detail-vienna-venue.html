<meta content='Hören Sie Meisterwerke der klassischen Musik in einem Konzert im Herzen Wiens, der Kapuzinerkirche. Neben Mozarts namensgebender Eine kleine Nachtmusik finden sich auch Schuberts Ave Maria, Haydns Kaiserquartett und Bachs Air im Programm. Kommen Sie am Abend zu einem Konzert in die Kapuzinerkirche und lassen Sie sich von der Musik des Wiener Kaiserquartetts verzaubern.
Anlässlich des 400-jährigen Jubiläums der Grundsteinlegung von Kapuzinerkirche und Kapuzinergruft im Jahr 1622 wurde 2022 auch der Grundstein für die Kammerkonzerte gelegt – kaiserlich allemal.
Kombi-Ticket: Kombinieren Sie Ihren Konzertbesuch mit der berühmtesten Gruft der Welt, der Kaisergruft. Die Grabstätte von rund 150 Mitgliedern der Habsburger seit 1618 lässt Sie 400 Jahre österreichischer und europäischer Geschichte spüren. Bestaunen Sie die Grabmäler berühmter Herrscherpersönlichkeiten, wie Kaiser Franz Joseph und seiner wunderschönen Frau Elisabeth "Sisi" oder den beeindruckenden Doppelsarg von Kaiserin Maria Theresia. Letzter Einlass in die Gruft ist um 17:30, sodass es sich wunderbar mit dem Konzert kombinieren lässt.
Interpreten:
Wiener Kaiserquartett' property="og:description"/>
