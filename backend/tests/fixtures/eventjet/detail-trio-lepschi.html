<meta content='In Zusammenarbeit mit dem Kultursommer Traismauer
Stefan Slupetzky - Texte, Gesang, Säge
Martin Zrost - Komposition, Arrangement, Gesang, Gitarre, Klarinetten
Michael Kunz  - Komposition, Arrangement, Gesang, Gitarre, Nasenflöte
Leise flattern ihre Lider,
leise knarren ihre Mieder,
selten nüchtern, selten wach,
infantil und altersschwach,
adipös und kakophon:
Umfang ist der Welten Lohn.
Kennen tun sich die Herren Zrost und Slupetzky ja schon dreißig Jahre lang, und musiziert haben sie schon damals miteinander. Dann sind sie getrennte Wege gegangen, Wege, die sie in die Schriftstellerei, die gewerbliche Tonkunst, die bildende Kunst und – nicht zuletzt – in multiple Vaterschaften geführt haben. Vom Herrn Kunz wieder heißt es, er habe die Kunst der Thanatopraxie erlernt und übe sie erfolgreich bei den städtischen Verkehrsbetrieben aus. Behauptet wird allerdings auch, dass er Tierpfleger in Schönbrunn bzw. Kindergärtner bei Ikea sei. Die einen sagen so, die anderen so. Gitarre spielt er jedenfalls wie der Leibhaftige.
Ernst Molden, "Kurier"
Vor allem aber: Trio Lepschi. Dieses tintenrabenpechschwarze Wunder versüßt mir meinen Herbst am nachhaltigsten. Die Band besteht aus Stefan Slupetzky, dem Krimischreiber, aus seinem Bruder Tomas und aus dem Jazzmusiker Martin Zrost. In 16 Liedern wird Folgendes thematisiert: der Tod, die Krise, der Sex als Handicap und die Ausländer, also lauter Bereiche, in denen der Wiener Kernkompetenz besitzt.
Die Songs pflegen ein Zusammenspiel von der verhaltenen Gewalt der Tiger Lillies, besitzen aber dazu Textgehalt wie bei Karl Kraus und zu alldem ein ebenso verhaltenes diebisches Vergnügen am Ausleuchten der Finsternis. Ja, da lacht das Herz: Beese Mauna, heißt die eine Lieblingsnummer von mir, Beese Mauna siagt ma niemois duach die Stroßn huschn, / denn die wohnan draußt im Greanan hinta hoche Buschn. Oder: Waunst ned wüüst, dass des Lebm mit dia schpüüt, daun spüüst am bestn söwa mit dein Lebm. Genau: der Herbst ist eine Wiener Erfindung, seine Überwindung im Unendlichen das größte Wiener Talent.
