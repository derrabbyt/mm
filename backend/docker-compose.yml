services:
    redis:
        image: redis:latest
        restart: unless-stopped
        container_name: redis
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD:?}
        ports:
            - '${REDIS_PORT:?}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
    postgres:
        image: postgis/postgis:17-3.5
        restart: unless-stopped
        container_name: postgis
        ports:
            - '${POSTGRES_PORT:?}:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?}
            POSTGRES_USER: ${POSTGRES_USER:?}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
            interval: 5s
            timeout: 5s
            retries: 10
    photon:
        image: rtuszik/photon-docker:latest
        restart: unless-stopped
        container_name: photon
        environment:
            REGION: at
            UPDATE_STRATEGY: DISABLED
            MIN_INDEX_DATE: ""
            UV_NO_SYNC: "1"
        ports:
            - '${PHOTON_PORT:?}:2322'
        volumes:
            - ${PHOTON_DATA_DIR:-./data/photon}:/photon/data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:2322/status"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 60s

volumes:
  postgres_data:
  redis_data:
