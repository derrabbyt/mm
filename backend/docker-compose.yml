services:
    redis:
        image: redis:latest
        restart: unless-stopped
        container_name: redis
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD:?}
        ports:
            - '${REDIS_PORT:?}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
    postgres:
        image: postgis/postgis:17-3.5
        restart: unless-stopped
        container_name: postgis
        ports:
            - '${POSTGRES_PORT:?}:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?}
            POSTGRES_USER: ${POSTGRES_USER:?}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
            interval: 5s
            timeout: 5s
            retries: 10
    photon:
        image: rtuszik/photon-docker:latest
        restart: unless-stopped
        container_name: photon
        environment:
            REGION: at
            UPDATE_STRATEGY: DISABLED
            MIN_INDEX_DATE: ""
            UV_NO_SYNC: "1"
        ports:
            - '${PHOTON_PORT:?}:2322'
        volumes:
            - ${PHOTON_DATA_DIR:-./data/photon}:/photon/data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:2322/status"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 60s

    # Application containers. Five of the six run the same image with a
    # different command; the bake has an image of its own, because a JVM is not
    # something an API should be carrying. None of them start by default, so
    # `docker compose up` still brings up infrastructure only and
    # `uv run fastapi dev` keeps working.
    #   docker compose --profile app up      api + rq worker
    #   docker compose --profile jobs up     the scheduled jobs
    api:
        build: &app_image
            context: .
            target: app
        profiles: ["app"]
        restart: unless-stopped
        env_file: .env
        environment: &in_cluster
            POSTGRES_HOST: postgres
            REDIS_HOST: redis
        ports:
            - '${API_PORT:-8000}:8000'
        volumes:
            # Read-only: the matrix job writes these folders, the API only maps them.
            - ./app/data/output_dev:/srv/app/data/output_dev:ro
        depends_on: &infra_ready
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        build: *app_image
        profiles: ["app"]
        restart: unless-stopped
        command: ["python", "-m", "app.modules.demo.worker"]
        env_file: .env
        environment: *in_cluster
        depends_on: *infra_ready

    # `--every` is the development stand-in for a scheduler. In production these
    # become CronJobs/scheduled tasks running the same command without the flag,
    # which is why the runner exits non-zero on failure.
    scrape-events:
        build: *app_image
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "scrape-events", "--every", "3600"]
        env_file: .env
        environment: *in_cluster
        volumes:
            # The payload archive outlives the container on purpose: it is the
            # evidence for fixing a parser against the document that broke it,
            # and a restart is exactly when somebody goes looking for it. The
            # run expires it on its own schedule, so it stays bounded.
            - scrape_archive:/srv/data/archive
        depends_on: *infra_ready

    ingest-geodata:
        build: *app_image
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "ingest-geodata", "--every", "86400"]
        env_file: .env
        environment: *in_cluster
        depends_on: *infra_ready

    build-pois:
        build: *app_image
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "build-pois", "--every", "86400"]
        env_file: .env
        environment: *in_cluster
        depends_on: *infra_ready

    # The one container with a Java runtime, and the one that needs a lot of
    # memory: the Python side of a full bake wants about 4 GB on top of the
    # 6 GB heap pinned in etc/r5py.yml. Build it with
    # `docker compose build bake-matrices` once scripts/fetch-r5-jar.sh has put
    # the engine's jar in vendor/.
    bake-matrices:
        build:
            context: .
            target: matrix
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "bake-matrices", "--every", "604800"]
        env_file: .env
        environment:
            <<: *in_cluster
            MATRIX_OSM_PATH: /srv/data/geodata/vienna.osm.pbf
            MATRIX_GTFS_PATH: /srv/data/geodata/wl.zip
            # The engine's cache: the parsed transport network, 450 MB of it,
            # and the only thing here worth keeping between runs. The jar is not
            # in it on purpose - the cache expires its contents after a
            # fortnight, which on a weekly schedule is how a job deletes its own
            # dependency.
            XDG_CACHE_HOME: /srv/cache
        volumes:
            # Read-write, and the same directory the API mounts read-only: a
            # Dataset is published by renaming a manifest inside it, so there is
            # no staging directory and no symlink. See ADR 0006.
            - ./app/data/output_dev:/srv/app/data/output_dev
            # What it routes over. Read-only, because the bake fetches nothing
            # and writes nothing here - the geodata job owns this directory.
            - ./data/geodata:/srv/data/geodata:ro
            - r5py_cache:/srv/cache
        depends_on: *infra_ready

volumes:
  postgres_data:
  redis_data:
  scrape_archive:
  r5py_cache:
