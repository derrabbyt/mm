services:
    redis:
        image: redis:latest
        restart: unless-stopped
        container_name: redis
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
        environment:
            REDISCLI_AUTH: ${REDIS_PASSWORD:?}
        ports:
            - '${REDIS_PORT:?}:6379'
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 5s
            retries: 10
    postgres:
        image: postgis/postgis:17-3.5
        restart: unless-stopped
        container_name: postgis
        ports:
            - '${POSTGRES_PORT:?}:5432'
        environment:
            POSTGRES_DB: ${POSTGRES_DB:?}
            POSTGRES_USER: ${POSTGRES_USER:?}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
            interval: 5s
            timeout: 5s
            retries: 10
    photon:
        image: rtuszik/photon-docker:latest
        restart: unless-stopped
        container_name: photon
        environment:
            REGION: at
            UPDATE_STRATEGY: DISABLED
            MIN_INDEX_DATE: ""
            UV_NO_SYNC: "1"
        ports:
            - '${PHOTON_PORT:?}:2322'
        volumes:
            - ${PHOTON_DATA_DIR:-./data/photon}:/photon/data
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:2322/status"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 60s

    api:
        build: &app_image
            context: .
            target: app
        profiles: ["app"]
        restart: unless-stopped
        env_file: .env
        environment: &in_cluster
            POSTGRES_HOST: postgres
            REDIS_HOST: redis
        ports:
            - '${API_PORT:-8000}:8000'
        volumes:
            - ./app/data/output_dev:/srv/app/data/output_dev:ro
        depends_on: &infra_ready
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    worker:
        build: *app_image
        profiles: ["app"]
        restart: unless-stopped
        command: ["python", "-m", "app.modules.demo.worker"]
        env_file: .env
        environment: *in_cluster
        depends_on: *infra_ready

    scrape-events:
        build: *app_image
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "scrape-events", "--every", "3600"]
        env_file: .env
        environment: *in_cluster
        volumes:
            - scrape_archive:/srv/data/archive
        depends_on: *infra_ready

    ingest-geodata:
        build: *app_image
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "ingest-geodata", "--every", "86400"]
        env_file: .env
        environment: *in_cluster
        depends_on: *infra_ready

    build-pois:
        build: *app_image
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "build-pois", "--every", "86400"]
        env_file: .env
        environment: *in_cluster
        depends_on: *infra_ready

    bake-matrices:
        build:
            context: .
            target: matrix
        profiles: ["jobs"]
        restart: unless-stopped
        command: ["python", "-m", "app.jobs.runner", "bake-matrices", "--every", "604800"]
        env_file: .env
        environment:
            <<: *in_cluster
            MATRIX_OSM_PATH: /srv/data/geodata/vienna.osm.pbf
            MATRIX_GTFS_PATH: /srv/data/geodata/wl.zip
            XDG_CACHE_HOME: /srv/cache
        volumes:
            - ./app/data/output_dev:/srv/app/data/output_dev
            - ./data/geodata:/srv/data/geodata:ro
            - r5py_cache:/srv/cache
        depends_on: *infra_ready

volumes:
  postgres_data:
  redis_data:
  scrape_archive:
  r5py_cache:
