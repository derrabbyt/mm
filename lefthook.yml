lefthook: |
  cd frontend
  npm exec -- lefthook

pre-commit:
  parallel: true
  jobs:
    - name: backend-ruff
      root: backend/
      glob:
        - "*.py"
        - "**/*.py"
      # Piped so format finishes rewriting the files before check reads them.
      group:
        piped: true
        jobs:
          - name: format
            run: uv run ruff format {staged_files}
            stage_fixed: true
          - name: check
            run: uv run ruff check {staged_files}

    - name: frontend-ng-lint
      root: frontend/
      glob:
        - "*.ts"
        - "**/*.ts"
        - "*.html"
        - "**/*.html"
      run: npm run lint